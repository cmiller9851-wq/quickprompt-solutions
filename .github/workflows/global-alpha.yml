name: Global Alpha Validation

on:
  push:
    branches: [main, global-alpha]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse JSON artifacts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python -m json.tool "$file" >/dev/null
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify alpha charter
        run: test -s GLOBAL_ALPHA.md
